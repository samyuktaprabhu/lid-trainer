name: React trainer validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/react-typescript-rebuild]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit generated dependency lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/react-typescript-rebuild'
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm dependency lockfile"
            git push
          fi
      - name: Run TypeScript and production build
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser-level QA
        run: npm run test:e2e
